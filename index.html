    <script>

        theme: {

            backgroundImage: {

    <style>
      body {
        background-color: #050505;
        color: white;
      }
      .text-stroke {
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.1);
        color: transparent;
      }
      .text-stroke-lime {
        -webkit-text-stroke: 1px rgba(204, 255, 0, 0.3);
        color: transparent;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ccff00;
      }
      
      model-viewer {
        width: 100%;
        height: 100%;
        --poster-color: transparent;
      }
